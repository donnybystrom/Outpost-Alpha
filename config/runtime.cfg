[audio]
music_enabled=false
music_volume_db=-24.0

[ui]
; Physical HUD scale after compensating for Godot's canvas stretch.
; 1.0 keeps one UI unit at one window pixel, independent of window size.
; Suggested range: 0.75 for low-resolution displays, 1.0 standard, 1.5-2.0 for high-DPI displays.
gui_scale_factor=2

[lighting]
; Directional-light orientation in degrees.
sun_pitch_degrees=-48.0
sun_yaw_degrees=-28.0
sun_roll_degrees=0.0

; Debug/demo orbit. Keep disabled for stable production shadows.
sun_orbit_enabled=false
sun_orbit_degrees_per_second=10.0

; Realtime directional shadow controls.
shadow_enabled=true
shadow_blur=0.10
shadow_pssm_splits=4
shadow_max_distance=48.0
shadow_opacity=0.82
shadow_bias=0.008
shadow_normal_bias=0.20
shadow_fade_start=0.9
shadow_blend_splits=false
; Disabled until the grid massif footprint has a contour-smoothed shadow proxy.
mountain_cast_shadows=false

; Shadowless building-only fill light. Buildings still receive the world sun
; directly and cast its ground shadows, but do not receive self-shadows.
building_light_enabled=true
building_light_pitch_degrees=-58.0
building_light_yaw_degrees=132.0
building_light_roll_degrees=0.0
building_light_energy=0.42

[planet_lander_tuning]
; Reloaded every time the landing is prepared, including when R replays it.
; Save this file, return to the running game, and press R to test new values.
flying_model_scale=1.095
flying_offset_up=0.22
flying_offset_screen_right=0.12
